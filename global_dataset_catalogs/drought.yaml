schema_version: 0.1.0
data_sources:
- id: amadeus:source/csic_speibase
  name: csic_speibase
  label: CSIC SPEIbase
  producer_institution: CSIC; IPE; experimental station Aula Dei
  homepage: https://spei.csic.es/database.html
  access_protocol: https_bulk_file
  requires_authentication: false
  amadeus_function_suffix: _drought
  description: 'SPEIbase v2.11.0: CRU TS 4.09 monthly precipitation and FAO-56 Penman–Monteith PET, 1901–2024.
    All 48 native lookback headers/coordinate arrays were inspected via original HDF5 prefixes; no full
    science arrays were downloaded. Distinct from GridMET SPEI and the Thornthwaite-based real-time SPEI
    Global Drought Monitor. The R adapter can fall back to older versions or reuse cached files; verify
    native version before selecting this profile. ODbL database terms and individual-content terms apply
    as documented by CSIC.'
  license_spdx: ODbL-1.0
  citation_apa: 'Beguería S., Vicente-Serrano S., Reig F., Latorre B. (2014) Standardized precipitation
    evapotranspiration index (SPEI) revisited: Parameter fitting, evapotranspiration models, tools, datasets
    and drought monitoring. International Journal of Climatology 34, 3001-3023. Vicente-Serrano S.M.,
    Beguería S., López-Moreno J.I. (2010) A Multiscalar Drought Index Sensitive to Global Warming: The
    Standardized Precipitation Evapotranspiration Index. Journal of Climate 23, 1696–1718. Beguería S.,
    Vicente-Serrano S., Angulo-Martínez M. (2010) A multi-scalar global drought data set: the SPEIbase.
    Bulletin of the American Meteorological Society 91(10), 1351–1356.'
- id: amadeus:source/noaa_psl_eddi
  name: noaa_psl_eddi
  label: NOAA PSL EDDI CONUS archive
  producer_institution: NOAA Physical Sciences Laboratory
  homepage: https://psl.noaa.gov/eddi/
  access_protocol: https_bulk_file
  requires_authentication: false
  amadeus_function_suffix: _drought
  description: Daily standardized evaporative-demand anomalies from FAO56 0.5 m tall-reference-crop ET
    driven by NLDAS-2, rank-based/nonparametric standardization. Provider describes same-window full-period
    reference (1979–present), not GridMET 1980–2016 calibration. The AMADEUS downloader samples Tuesdays
    and uses a legacy FTP hostname; sampling does not make the native daily archive weekly. Preserve changing
    archive/method vintages.
  citation_apa: 'Hobbins et al. (2016), EDDI methodology. https://doi.org/10.1175/JHM-D-15-0121.1. Data
    and current method description: https://psl.noaa.gov/eddi/.'
- id: amadeus:source/ndmc_usdm
  name: ndmc_usdm
  label: U.S. Drought Monitor
  producer_institution: NDMC, USDA and NOAA partnership; see current provider credits
  homepage: https://droughtmonitor.unl.edu/
  access_protocol: https_bulk_file
  requires_authentication: false
  amadeus_function_suffix: _drought
  description: Weekly expert drought synthesis, not an instrumental index or a county-native measurement.
    Credit NDMC/USDA/NOAA as requested by the provider; do not copy NOAA-only public-domain or SPEI database
    licensing to this joint product.
  citation_apa: U.S. Drought Monitor. Credit the National Drought Mitigation Center, U.S. Department of
    Agriculture and NOAA as requested at https://droughtmonitor.unl.edu/DmData/GISData.aspx; identify
    the weekly assessment date.
products:
- id: amadeus:product/speibase_211_01month
  name: speibase_211_01month
  label: SPEIbase v2.11 1-month
  data_source: amadeus:source/csic_speibase
  data_genre:
  - drought
  - climate
  native_format: netcdf4_cf
  spatial_support_type: raster_grid_cell
  temporal_resolution: monthly
  description: Calendar-month CRU water-balance lookback, distinct from observation cadence P1M. Native
    representative timestamps are mid-month points (first 1901-01-16, final 2024-12-16), not verified
    interval bounds or lookback endpoints. Preserve these native coordinates; no interpolation or independent
    monthly-sum interpretation of SPEI. Initial lookback periods and masked land/ocean cells can be missing.
    Source methods and native version identify the index, but an undocumented fit/reference interval is
    not inferred from data coverage. SPEIbase is not a companion categorical drought map.
  product_version: 2.11.0
  grid_definition: amadeus:grid/csic_speibase_211_global_05deg
  crs: EPSG:4326
  srid: 4326
  calendar: gregorian
  temporal_resolution_iso: P1M
  temporal_coverage_start: '1901-01-16'
  temporal_coverage_end: '2024-12-16'
  native_spatial_resolution_descriptor: 0.5 degree global cell centres verified from native coordinates
  spatial_extent_descriptor: Global 720 × 360 geographic grid; terrestrial index masks apply
  access_url: https://spei.csic.es/spei_database_2_11/nc/spei01.nc
  amadeus_process_covariate: drought
  amadeus_calculate_covariate: drought
  amadeus_dataset_name: drought
