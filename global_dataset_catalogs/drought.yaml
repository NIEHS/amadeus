  name: usdm_weekly_merged_m
  label: USDM weekly merged M polygons
  data_source: amadeus:source/ndmc_usdm
  data_genre:
  - drought
  native_format: shapefile
  spatial_support_type: polygon
  temporal_resolution: multi_day
  description: 'Pinned merged M shapefile family used by the R downloader. The inspected 2020 M file has
    mutually exclusive class interiors: all ten pairwise intersections have zero area. Do not confuse
    these polygons with cumulative D0–D4 summary statistics or raw/unmerged delivery families. Class-specific
    area fractions use exclusive intersections; cumulative Dk-or-worse statistics are derived by summing
    exclusive classes k through 4. Validate topology in each selected vintage. Absence is not automatically
    no drought without confirmed assessment coverage. Tuesday represents assessment date; routine publication
    is Thursday. Observed weekly status is not a seven-day mean. Native WGS84 PRJ was inspected.'
  crs: EPSG:4326
  srid: 4326
  temporal_resolution_iso: P7D
  update_cadence_iso: P7D
  spatial_extent_descriptor: U.S. assessment polygons in the selected weekly M archive
  native_spatial_resolution_descriptor: Drought assessment polygons, not county-native support
  access_url: https://droughtmonitor.unl.edu/Data/shapefiles_m/
  amadeus_process_covariate: drought
  amadeus_calculate_covariate: drought
  amadeus_dataset_name: drought
