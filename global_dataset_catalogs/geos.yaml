schema_version: 0.1.0
data_sources:
- id: amadeus:source/nasa_gmao_geos_cf_v1
  name: nasa_gmao_geos_cf_v1
  label: NASA GEOS-CF v1 replay
  producer_institution: NASA Global Modeling and Assimilation Office
  homepage: https://gmao.gsfc.nasa.gov/gmao-products/geos-cf/
  access_protocol: https_bulk_file
  requires_authentication: false
  amadeus_function_suffix: _geos
  description: 'NASA GEOS-CF v1 replay/constituent simulation, distinct from GEOS-FP, v2 and forecasts.
    The selected NCCS /v1/ana/ HTTPS route is public: six original GEOS-CF.v01.rpl files were inspected
    without credentials on 2026-11-09. This is endpoint-specific evidence, not a claim about all NASA
    services. The current download_geos R adapter separately requires an Earthdata token; it was not changed.
    The workbook Amadeus data sources!I13 says Earthdata login required; that does not describe access
    to these tested public URLs. The schema slot description also generalizes GEOS authentication; the
    boolean here describes the selected provider route. Inventory H13 Active is source status, J13 2018
    is history, N13 global is coverage context; none establishes per-file availability or validity. Cite
    Keller et al. (2021), methods DOI 10.1029/2020MS002413, not a collection DOI. See geos_review_20261109/README.md
    for evidence and outstanding datum/ETH/TH questions. No verified archive end date is asserted.'
  citation_apa: Keller et al. (2021). Description of the NASA GEOS Composition Forecast Modeling System
    GEOS-CF v1.0. https://doi.org/10.1029/2020MS002413. Methods citation, not a collection-specific data
    DOI.
