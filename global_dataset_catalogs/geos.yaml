  - aerosols
  native_format: netcdf4_cf
  spatial_support_type: model_grid_cell
  temporal_resolution: hourly
  description: 'Pinned original GEOS-CF v01 replay collection, NASA Office Note 17 v1.3 (2022), section
    6. All registered fields verified in GEOS-CF.v01.rpl.aqc_tavg_1hr_g1440x721_v1.20180101_0030z.nc4
    on 2026-11-09. Native timestamp 2018-01-01 00:30:00 represents the 00:00–01:00 hourly average, corroborated
    by native global RangeBeginning/Ending attributes. No explicit CF time bounds, calendar, or science
    cell_methods attribute occurs in this sample; global range metadata are separate evidence, not fabricated
    CF bounds. Read each delivered file time, dimensions, fill and packing attributes; this one-granule
    check does not establish archive-wide coverage or invariance. Coordinates have 1440 longitudes (-180
    to 179.75) and 721 latitudes (-90 to 90), both 0.25 degree spacing. The sample supplies no grid_mapping
    or explicit datum/earth radius; AMADEUS:100004 remains unresolved and geometry ingestion/transformation
    must fail closed. Model layer 72 is the lowest model layer, not a fixed measurement height. p23 has
    23 native hPa levels; PS/SLP retain their actual 2-D spatial dimensions. XGC has no lev coordinate.
    Dry-air mole fraction, aerosol schemes, columns and deposition bases remain distinct. ETH and TH remain
    separate unresolved identities. No v2 or forecast substitution, forecast-reference-time assumption,
    physical valid range, or archive end date is added. Evidence and further actions: geos_review_20261109/README.md.'
  product_version: GEOS-CF v1.0; file specification v1.3 (2022)
  grid_definition: amadeus:grid/geos_cf_v1_025_hybrid_model_layer_index
  crs: AMADEUS:100004
  temporal_resolution_iso: PT1H
  native_spatial_resolution_descriptor: 0.25 degree longitude × 0.25 degree latitude; 1440 × 721 coordinate
