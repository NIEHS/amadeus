data_sources:
- id: amadeus:source/usgs_epa_nhdplus_v21
  name: usgs_epa_nhdplus_v21
  label: NHDPlus V2.1 National WBD snapshot
  producer_institution: USGS and U.S. EPA
  homepage: https://www.epa.gov/waterdata/nhdplus-national-data
  access_protocol: https_bulk_file
  requires_authentication: false
  amadeus_function_suffix: _huc
  description: 'Pinned NHDPlus V2.1 National Seamless Geodatabase WBD snapshot, not NHDPlus HR or current
    WBD. Government public-domain statement and citation request are retained without inventing an SPDX
    identifier. OceanCatchment archives contain a distinct feature family; remote hydrogeofetch fallback
    does not prove the same vintage or fields as the pinned archive. [Resource reconciliation: inventory
    rights and history] Inventory usage/citation statement (Amadeus data sources!I12): Public domain (U.S.
    Gov); citation requested. Inventory source status (H12): Static (NHDPlus V2.1 no longer updated);
    this is not observation QA, API availability or verified support for every product. Inventory first-release/history
    wording (J12): 2012. NHDPlus V2.1 National Seamless WBD snapshot is distinct from current National
    Map/NHDPlus HR. Generic NHD citation is context, not proof of archive version or layer CRS.'
  citation_apa: U.S. Environmental Protection Agency. NHDPlus V2.1 National Seamless Geodatabase release
    notes. https://dmap-data-commons-ow.s3.amazonaws.com/NHDPlusV21/Data/NationalData/0Release_Notes_NationalData_Seamless_GeoDatabase.pdf.
    Archive suffixes are recorded on Product.
