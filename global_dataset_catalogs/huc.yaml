  data_genre:
  - hydrology
  - water
  native_format: geodatabase
  spatial_support_type: polygon
  temporal_resolution: timeless
  description: 'Feature class WBDSnapshot/HUC12, explicitly documented in EPA National Seamless release
    notes, pages 21–26. Not a catchment feature class. HUC_2/4/6 were added to this national snapshot;
    HUC_8/10/12 and AreaHUC12 retain native names. Codes are categorical strings; HUC_12 must remain 12
    digits with leading zeros. Parent codes express hierarchy without inventing subclass tables. Region-specific
    release numbers are archive suffixes, not a new NHDPlus version. Check actual FileGDB layer name and
    CRS before use. Fixture NAD83 EPSG:4269 establishes only its rewritten GeoPackage CRS and is not assigned
    to the complete native archive. WBD_Date is feature snapshot provenance, not a contemporary observation
    interval. [Resource reconciliation: inventory completeness] Inventory coverage statement (Amadeus
    data sources!N12): Yes (Lower 48 + HI/PR/VI). This statement does not establish validity of every
    cell/date or fill observation gaps.'
  product_version: NHDPlus V2.1 National Seamless Lower48_07
