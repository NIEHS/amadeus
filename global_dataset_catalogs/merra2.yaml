  description: 'NASA MERRA-2 delivered regular longitude/latitude grid, not the native dynamics cube sphere.
    For instantaneous collections temporal_resolution=instantaneous and temporal_resolution_iso stores
    sampling cadence (including PT6H); this does not assert a six-hour mean or require a new enum. Pressure
    coordinates are not altitude. Hybrid layers require native coefficients/DELP and PS for physical pressure;
    index 1 is near the top, not the surface. Column and surface fields in 3-D collections remain 2-D
    as their native dimensions indicate. No forecast lead time is asserted. Daily temperature extrema
    cover 00:00–23:59 UTC; preserve actual timestamps/bounds for other daily diagnostics, including HOURNORAIN
    whose reduction is not specified. Current NASA DOI and timing supersede conflicting workbook bibliography/cadence.
    Required CRS slot uses an explicitly unresolved project-local placeholder; geographic axis spacing
    is verified, but datum/radius and numeric engine SRID are not established. Nominal monthly publication
    has approximately three weeks latency after month end in current NASA CMR; publication cadence is
    not observation frequency or a file-specific availability guarantee. [Resource reconciliation: inventory
    completeness] Inventory coverage statement (Amadeus data sources!N9): Yes (global). This statement
    does not establish validity of every cell/date or fill observation gaps.'
