  spatial_support_type: model_grid_cell
  temporal_resolution: timeless
  description: 'Soil water content (volumetric) in percent for 33 kPa and 1500 kPa suctions predicted
    at 6 standard depths (0, 10, 30, 60, 100 and 200 cm) at 250 m resolution. Training points are based
    on a global compilation of soil profiles (USDA NCSS, AfSPDB, ISRIC WISE, EGRPR, SPADE, CanNPDB, UNSODA,
    SWIG, HYBRAS and HydroS). Data import steps are available here. Spatial prediction steps are described
    in detail here. Note: these are actually measured and mapped soil content values; no Pedo-Transfer-Functions
    have been used (except to fill-in the missing NCSS bulk densities). Available water capacity in mm
    (derived as a difference between field capacity and wilting point multiplied by layer thickness) per
    layer is available here. Antarctica is not included.. 5 available depth-specific first-image TIFF
    headers verify grid, byte storage, nodata 255 and WGS84. Nominal 250 m corresponds to native 0.002083333
    degree cells, not globally constant metres. Native 1950–2017 labels are the long-term modelling reference,
