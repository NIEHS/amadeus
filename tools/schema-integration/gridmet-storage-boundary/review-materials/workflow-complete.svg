<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2040.0 3216.0" role="img"><title>Amadeus storage-boundary workflow — scripts and timing</title><rect x="0.00" y="0.00" width="2040.00" height="3216.00" fill="#FFFFFF" stroke="#FFFFFF"/><rect x="0.00" y="0.00" width="14.40" height="3216.00" fill="#007F83" stroke="#007F83"/><text x="60.00" y="72.03" font-family="DejaVu Sans,Arial,sans-serif" font-size="38.33" font-weight="700" fill="#153342">AMADEUS SCHEMA INTEGRATION AT THE STORAGE BOUNDARY</text><text x="60.00" y="145.07" font-family="DejaVu Sans,Arial,sans-serif" font-size="26.67" font-weight="400" fill="#526A78">Ordinary calls • recording during science • validation after calculate / during load / at saved open</text><text x="60.00" y="215.50" font-family="DejaVu Sans,Arial,sans-serif" font-size="25.00" font-weight="700" fill="#007F83">AI: development, review and documentation only. Runtime: R / JSON Schema / SQL. Human approval: pending.</text><rect x="66.00" y="288.00" width="444.00" height="188.40" fill="#F1F5F7" stroke="#D5E0E5"/><text x="86.40" y="326.63" font-family="DejaVu Sans,Arial,sans-serif" font-size="28.33" font-weight="700" fill="#007F83">01 Build contracts and</text><text x="86.40" y="360.63" font-family="DejaVu Sans,Arial,sans-serif" font-size="28.33" font-weight="700" fill="#007F83">catalog</text><text x="86.40" y="416.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="20.00" font-weight="400" fill="#526A78">Build / changed release only</text><rect x="540.00" y="288.00" width="1428.00" height="188.40" fill="#F1F5F7" stroke="#D5E0E5"/><text x="558.00" y="321.93" font-family="DejaVu Sans,Arial,sans-serif" font-size="23.33" font-weight="700" fill="#153342">dev/build_dataset_metadata.R; build_parquet_contract.R; check_approval.R; validate_release.R</text><text x="558.00" y="376.77" font-family="DejaVu Sans,Arial,sans-serif" font-size="21.67" font-weight="400" fill="#24414E">IN: LinkML definitions, package code/labels, unit policy and evidence → OUT: Pinned JSON Schema, SQL, catalog and runtime</text><text x="558.00" y="402.77" font-family="DejaVu Sans,Arial,sans-serif" font-size="21.67" font-weight="400" fill="#24414E">contract</text><text x="558.00" y="434.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="20.00" font-weight="400" fill="#526A78">Approve authoritative definitions and native-unit/time policy. Build consistency does not equal scientific approval.</text><line x1="288.00" y1="476.40" x2="288.00" y2="494.40" stroke="#007F83" stroke-width="2"/><polygon points="288.00,494.40 282.73,484.75 293.27,484.75" fill="#007F83"/><rect x="66.00" y="494.40" width="444.00" height="188.40" fill="#F1F5F7" stroke="#D5E0E5"/><text x="86.40" y="533.03" font-family="DejaVu Sans,Arial,sans-serif" font-size="28.33" font-weight="700" fill="#007F83">02 User request</text><text x="86.40" y="622.40" font-family="DejaVu Sans,Arial,sans-serif" font-size="20.00" font-weight="400" fill="#526A78">Before science</text><rect x="540.00" y="494.40" width="1428.00" height="188.40" fill="#F1F5F7" stroke="#D5E0E5"/><text x="558.00" y="528.33" font-family="DejaVu Sans,Arial,sans-serif" font-size="23.33" font-weight="700" fill="#153342">Ordinary caller; examples/ordinary_with_recording.R is a test example</text><text x="558.00" y="583.17" font-family="DejaVu Sans,Arial,sans-serif" font-size="21.67" font-weight="400" fill="#24414E">IN: Variables, dates, locations, paths and method arguments → OUT: Actual request passed to unchanged Amadeus calls and</text><text x="558.00" y="609.17" font-family="DejaVu Sans,Arial,sans-serif" font-size="21.67" font-weight="400" fill="#24414E">recorder</text><text x="558.00" y="640.40" font-family="DejaVu Sans,Arial,sans-serif" font-size="20.00" font-weight="400" fill="#526A78">User chooses request. No runtime spreadsheet or AI service; tested scope is explicit.</text><line x1="288.00" y1="682.80" x2="288.00" y2="700.80" stroke="#007F83" stroke-width="2"/><polygon points="288.00,700.80 282.73,691.15 293.27,691.15" fill="#007F83"/><rect x="66.00" y="700.80" width="444.00" height="188.40" fill="#F1F5F7" stroke="#D5E0E5"/><text x="86.40" y="739.43" font-family="DejaVu Sans,Arial,sans-serif" font-size="28.33" font-weight="700" fill="#007F83">03 Amadeus download</text><text x="86.40" y="828.80" font-family="DejaVu Sans,Arial,sans-serif" font-size="20.00" font-weight="400" fill="#526A78">Science + recording</text><rect x="540.00" y="700.80" width="1428.00" height="188.40" fill="#F1F5F7" stroke="#D5E0E5"/><text x="558.00" y="734.73" font-family="DejaVu Sans,Arial,sans-serif" font-size="23.33" font-weight="700" fill="#153342">amadeus::download_data; R/provenance_recorder.R observes</text><text x="558.00" y="789.57" font-family="DejaVu Sans,Arial,sans-serif" font-size="21.67" font-weight="400" fill="#24414E">IN: Request and provider assets or available cache → OUT: Source files, recorded source hashes and call events</text><text x="558.00" y="846.80" font-family="DejaVu Sans,Arial,sans-serif" font-size="20.00" font-weight="400" fill="#526A78">No package patch. Cache identity is not proof of a fresh provider download.</text><line x1="288.00" y1="889.20" x2="288.00" y2="907.20" stroke="#007F83" stroke-width="2"/><polygon points="288.00,907.20 282.73,897.55 293.27,897.55" fill="#007F83"/><rect x="66.00" y="907.20" width="444.00" height="188.40" fill="#F1F5F7" stroke="#D5E0E5"/><text x="86.40" y="945.83" font-family="DejaVu Sans,Arial,sans-serif" font-size="28.33" font-weight="700" fill="#007F83">04 Amadeus process</text><text x="86.40" y="1035.20" font-family="DejaVu Sans,Arial,sans-serif" font-size="20.00" font-weight="400" fill="#526A78">Science + recording</text><rect x="540.00" y="907.20" width="1428.00" height="188.40" fill="#F1F5F7" stroke="#D5E0E5"/><text x="558.00" y="941.13" font-family="DejaVu Sans,Arial,sans-serif" font-size="23.33" font-weight="700" fill="#153342">amadeus::process_covariates; provenance_recorder.R observes</text><text x="558.00" y="995.97" font-family="DejaVu Sans,Arial,sans-serif" font-size="21.67" font-weight="400" fill="#24414E">IN: Source files, dates and site extent → OUT: Processed raster/TIFF and recorded call/output context</text><text x="558.00" y="1053.20" font-family="DejaVu Sans,Arial,sans-serif" font-size="20.00" font-weight="400" fill="#526A78">Existing processing behavior retained; capture changes and environment identities in any replay.</text><line x1="288.00" y1="1095.60" x2="288.00" y2="1113.60" stroke="#007F83" stroke-width="2"/><polygon points="288.00,1113.60 282.73,1103.95 293.27,1103.95" fill="#007F83"/><rect x="66.00" y="1113.60" width="444.00" height="188.40" fill="#F1F5F7" stroke="#D5E0E5"/><text x="86.40" y="1152.23" font-family="DejaVu Sans,Arial,sans-serif" font-size="28.33" font-weight="700" fill="#007F83">05 Amadeus calculate</text><text x="86.40" y="1241.60" font-family="DejaVu Sans,Arial,sans-serif" font-size="20.00" font-weight="400" fill="#526A78">Science + recording</text><rect x="540.00" y="1113.60" width="1428.00" height="188.40" fill="#F1F5F7" stroke="#D5E0E5"/><text x="558.00" y="1147.53" font-family="DejaVu Sans,Arial,sans-serif" font-size="23.33" font-weight="700" fill="#153342">amadeus::calculate_covariates; provenance_recorder.R observes</text><text x="558.00" y="1202.37" font-family="DejaVu Sans,Arial,sans-serif" font-size="21.67" font-weight="400" fill="#24414E">IN: Processed raster, sites and method → OUT: Ordinary R result frames and sealed execution context</text><text x="558.00" y="1259.60" font-family="DejaVu Sans,Arial,sans-serif" font-size="20.00" font-weight="400" fill="#526A78">Scientific computation ends here. Recorder operates alongside calls; it does not enforce the schema.</text><line x1="288.00" y1="1302.00" x2="288.00" y2="1320.00" stroke="#007F83" stroke-width="2"/><polygon points="288.00,1320.00 282.73,1310.35 293.27,1310.35" fill="#007F83"/><rect x="66.00" y="1320.00" width="444.00" height="188.40" fill="#E7F4EF" stroke="#D5E0E5"/><text x="86.40" y="1358.63" font-family="DejaVu Sans,Arial,sans-serif" font-size="28.33" font-weight="700" fill="#007F83">06 Verify actual context</text><text x="86.40" y="1448.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="20.00" font-weight="400" fill="#526A78">After calculation</text><rect x="540.00" y="1320.00" width="1428.00" height="188.40" fill="#E7F4EF" stroke="#D5E0E5"/><text x="558.00" y="1353.93" font-family="DejaVu Sans,Arial,sans-serif" font-size="23.33" font-weight="700" fill="#153342">R/export_gridmet.R; R/provenance_recorder.R verification</text><text x="558.00" y="1408.77" font-family="DejaVu Sans,Arial,sans-serif" font-size="21.67" font-weight="400" fill="#24414E">IN: Completed calculation outputs, actual request and recording → OUT: Verified context for export, or rejection</text><text x="558.00" y="1466.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="20.00" font-weight="400" fill="#526A78">No pilot example_gridmet.R orchestration or schema_validator.R checks in the active path. Core Amadeus checks remain.</text><line x1="288.00" y1="1508.40" x2="288.00" y2="1526.40" stroke="#007F83" stroke-width="2"/><polygon points="288.00,1526.40 282.73,1516.75 293.27,1516.75" fill="#007F83"/><rect x="66.00" y="1526.40" width="444.00" height="188.40" fill="#E7F4EF" stroke="#D5E0E5"/><text x="86.40" y="1565.03" font-family="DejaVu Sans,Arial,sans-serif" font-size="28.33" font-weight="700" fill="#007F83">07 Assemble and</text><text x="86.40" y="1599.03" font-family="DejaVu Sans,Arial,sans-serif" font-size="28.33" font-weight="700" fill="#007F83">validate records</text><text x="86.40" y="1654.40" font-family="DejaVu Sans,Arial,sans-serif" font-size="20.00" font-weight="400" fill="#526A78">After calculation / before publication</text><rect x="540.00" y="1526.40" width="1428.00" height="188.40" fill="#E7F4EF" stroke="#D5E0E5"/><text x="558.00" y="1560.33" font-family="DejaVu Sans,Arial,sans-serif" font-size="23.33" font-weight="700" fill="#153342">R/schema_export.R; R/storage_boundary.R</text><text x="558.00" y="1615.17" font-family="DejaVu Sans,Arial,sans-serif" font-size="21.67" font-weight="400" fill="#24414E">IN: Actual outputs/context, compiled catalog and contract → OUT: Accepted schema instance or rejection</text><text x="558.00" y="1672.40" font-family="DejaVu Sans,Arial,sans-serif" font-size="20.00" font-weight="400" fill="#526A78">Deterministic JSON Schema/R/SQL check structure, units/binding, dates, membership, finite values and lineage.</text><line x1="288.00" y1="1714.80" x2="288.00" y2="1732.80" stroke="#007F83" stroke-width="2"/><polygon points="288.00,1732.80 282.73,1723.15 293.27,1723.15" fill="#007F83"/><rect x="66.00" y="1732.80" width="444.00" height="188.40" fill="#E7F4EF" stroke="#D5E0E5"/><text x="86.40" y="1771.43" font-family="DejaVu Sans,Arial,sans-serif" font-size="28.33" font-weight="700" fill="#007F83">08 Write and read typed</text><text x="86.40" y="1805.43" font-family="DejaVu Sans,Arial,sans-serif" font-size="28.33" font-weight="700" fill="#007F83">Parquet</text><text x="86.40" y="1860.80" font-family="DejaVu Sans,Arial,sans-serif" font-size="20.00" font-weight="400" fill="#526A78">Storage boundary</text><rect x="540.00" y="1732.80" width="1428.00" height="188.40" fill="#E7F4EF" stroke="#D5E0E5"/><text x="558.00" y="1766.73" font-family="DejaVu Sans,Arial,sans-serif" font-size="23.33" font-weight="700" fill="#153342">R/storage_boundary.R; R/parquet_experiment.R</text><text x="558.00" y="1821.57" font-family="DejaVu Sans,Arial,sans-serif" font-size="21.67" font-weight="400" fill="#24414E">IN: Mapped actual records and compiled storage mapping → OUT: Typed Parquet and full-column readback evidence</text><text x="558.00" y="1878.80" font-family="DejaVu Sans,Arial,sans-serif" font-size="20.00" font-weight="400" fill="#526A78">DuckDB provides Parquet I/O. Typing/metadata alone do not establish scientific validity or true history.</text><line x1="288.00" y1="1921.20" x2="288.00" y2="1939.20" stroke="#007F83" stroke-width="2"/><polygon points="288.00,1939.20 282.73,1929.55 293.27,1929.55" fill="#007F83"/><rect x="66.00" y="1939.20" width="444.00" height="188.40" fill="#E7F4EF" stroke="#D5E0E5"/><text x="86.40" y="1977.83" font-family="DejaVu Sans,Arial,sans-serif" font-size="28.33" font-weight="700" fill="#007F83">09 Load and verify</text><text x="86.40" y="2011.83" font-family="DejaVu Sans,Arial,sans-serif" font-size="28.33" font-weight="700" fill="#007F83">DuckDB</text><text x="86.40" y="2067.20" font-family="DejaVu Sans,Arial,sans-serif" font-size="20.00" font-weight="400" fill="#526A78">During loading / before completion</text><rect x="540.00" y="1939.20" width="1428.00" height="188.40" fill="#E7F4EF" stroke="#D5E0E5"/><text x="558.00" y="1973.13" font-family="DejaVu Sans,Arial,sans-serif" font-size="23.33" font-weight="700" fill="#153342">R/database.R; R/parquet_experiment.R</text><text x="558.00" y="2027.97" font-family="DejaVu Sans,Arial,sans-serif" font-size="21.67" font-weight="400" fill="#24414E">IN: Accepted records, Parquet and generated DDL/integrity SQL → OUT: Loaded DB, integrity/fidelity and reopen receipts</text><text x="558.00" y="2085.20" font-family="DejaVu Sans,Arial,sans-serif" font-size="20.00" font-weight="400" fill="#526A78">102 SQL queries include empty tables. Schema acceptance alone is not a successful database publication.</text><line x1="288.00" y1="2127.60" x2="288.00" y2="2145.60" stroke="#007F83" stroke-width="2"/><polygon points="288.00,2145.60 282.73,2135.95 293.27,2135.95" fill="#007F83"/><rect x="66.00" y="2145.60" width="444.00" height="188.40" fill="#E7F4EF" stroke="#D5E0E5"/><text x="86.40" y="2184.23" font-family="DejaVu Sans,Arial,sans-serif" font-size="28.33" font-weight="700" fill="#007F83">10 Bind published</text><text x="86.40" y="2218.23" font-family="DejaVu Sans,Arial,sans-serif" font-size="28.33" font-weight="700" fill="#007F83">artifacts</text><text x="86.40" y="2273.60" font-family="DejaVu Sans,Arial,sans-serif" font-size="20.00" font-weight="400" fill="#526A78">After successful load</text><rect x="540.00" y="2145.60" width="1428.00" height="188.40" fill="#E7F4EF" stroke="#D5E0E5"/><text x="558.00" y="2179.53" font-family="DejaVu Sans,Arial,sans-serif" font-size="23.33" font-weight="700" fill="#153342">R/storage_boundary.R: storage_publish_manifest</text><text x="558.00" y="2234.37" font-family="DejaVu Sans,Arial,sans-serif" font-size="21.67" font-weight="400" fill="#24414E">IN: Actual owned artifact bytes and matching release/instance → OUT: Manifest hashes for files and receipts</text><text x="558.00" y="2291.60" font-family="DejaVu Sans,Arial,sans-serif" font-size="20.00" font-weight="400" fill="#526A78">Unsigned local integrity, not authenticated history or protection against coordinated privileged rewriting.</text><line x1="288.00" y1="2334.00" x2="288.00" y2="2352.00" stroke="#007F83" stroke-width="2"/><polygon points="288.00,2352.00 282.73,2342.35 293.27,2342.35" fill="#007F83"/><rect x="66.00" y="2352.00" width="444.00" height="188.40" fill="#E7F4EF" stroke="#D5E0E5"/><text x="86.40" y="2390.63" font-family="DejaVu Sans,Arial,sans-serif" font-size="28.33" font-weight="700" fill="#007F83">11 Complete and publish</text><text x="86.40" y="2424.63" font-family="DejaVu Sans,Arial,sans-serif" font-size="28.33" font-weight="700" fill="#007F83">pointer</text><text x="86.40" y="2480.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="20.00" font-weight="400" fill="#526A78">Publication</text><rect x="540.00" y="2352.00" width="1428.00" height="188.40" fill="#E7F4EF" stroke="#D5E0E5"/><text x="558.00" y="2385.93" font-family="DejaVu Sans,Arial,sans-serif" font-size="23.33" font-weight="700" fill="#153342">R/schema_export.R</text><text x="558.00" y="2440.77" font-family="DejaVu Sans,Arial,sans-serif" font-size="21.67" font-weight="400" fill="#24414E">IN: Successful storage checks and bound manifest → OUT: Read-only critical files, completed workflow and final LATEST</text><text x="558.00" y="2498.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="20.00" font-weight="400" fill="#526A78">Failed load must not complete or advance pointer. Not multi-file power-loss durability.</text><line x1="288.00" y1="2540.40" x2="288.00" y2="2558.40" stroke="#007F83" stroke-width="2"/><polygon points="288.00,2558.40 282.73,2548.75 293.27,2548.75" fill="#007F83"/><rect x="66.00" y="2558.40" width="444.00" height="188.40" fill="#E7F4EF" stroke="#D5E0E5"/><text x="86.40" y="2597.03" font-family="DejaVu Sans,Arial,sans-serif" font-size="28.33" font-weight="700" fill="#007F83">12 Verify open and</text><text x="86.40" y="2631.03" font-family="DejaVu Sans,Arial,sans-serif" font-size="28.33" font-weight="700" fill="#007F83">query</text><text x="86.40" y="2686.40" font-family="DejaVu Sans,Arial,sans-serif" font-size="20.00" font-weight="400" fill="#526A78">Each supported saved-store open</text><rect x="540.00" y="2558.40" width="1428.00" height="188.40" fill="#E7F4EF" stroke="#D5E0E5"/><text x="558.00" y="2592.33" font-family="DejaVu Sans,Arial,sans-serif" font-size="23.33" font-weight="700" fill="#153342">R/database.R; storage_verify_publication</text><text x="558.00" y="2647.17" font-family="DejaVu Sans,Arial,sans-serif" font-size="21.67" font-weight="400" fill="#24414E">IN: Completed publication, file hashes and release identity → OUT: Verified read-only DuckDB query, or rejection</text><text x="558.00" y="2704.40" font-family="DejaVu Sans,Arial,sans-serif" font-size="20.00" font-weight="400" fill="#526A78">No raw-source reread for saved query. Direct DBI/IDE access bypasses this verification path.</text><line x1="288.00" y1="2746.80" x2="288.00" y2="2764.80" stroke="#007F83" stroke-width="2" stroke-dasharray="7 5"/><polygon points="288.00,2764.80 282.73,2755.15 293.27,2755.15" fill="#007F83"/><rect x="66.00" y="2764.80" width="444.00" height="188.40" fill="#FFF2DD" stroke="#D5E0E5"/><text x="86.40" y="2803.43" font-family="DejaVu Sans,Arial,sans-serif" font-size="28.33" font-weight="700" fill="#007F83">13 Review evidence and</text><text x="86.40" y="2837.43" font-family="DejaVu Sans,Arial,sans-serif" font-size="28.33" font-weight="700" fill="#007F83">decide</text><text x="86.40" y="2892.80" font-family="DejaVu Sans,Arial,sans-serif" font-size="20.00" font-weight="400" fill="#526A78">Qualification / release review</text><rect x="540.00" y="2764.80" width="1428.00" height="188.40" fill="#FFF2DD" stroke="#D5E0E5"/><text x="558.00" y="2798.73" font-family="DejaVu Sans,Arial,sans-serif" font-size="23.33" font-weight="700" fill="#153342">Separate tests/direct_source_check.R and human review records</text><text x="558.00" y="2853.57" font-family="DejaVu Sans,Arial,sans-serif" font-size="21.67" font-weight="400" fill="#24414E">IN: Source comparisons, adversarial tests, replay, known limits → OUT: Scoped human decision or pending status</text><text x="558.00" y="2910.80" font-family="DejaVu Sans,Arial,sans-serif" font-size="20.00" font-weight="400" fill="#526A78">Units, physical time, binding, provenance truth and acceptance need human decisions. Production approval remains pending.</text><text x="66.00" y="3037.07" font-family="DejaVu Sans,Arial,sans-serif" font-size="26.67" font-weight="700" fill="#153342">Contract consistency is checked at build; actual-data checks follow calculate. Schema acceptance alone is not database</text><text x="66.00" y="3069.07" font-family="DejaVu Sans,Arial,sans-serif" font-size="26.67" font-weight="700" fill="#153342">publication. Gap closure requires tests plus human decisions.</text></svg>