<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920.0 2832.0" role="img"><title>Amadeus Schema Integration at the Storage Boundary</title><rect x="0.00" y="0.00" width="1920.00" height="2832.00" fill="#FFFFFF" stroke="#FFFFFF"/><rect x="0.00" y="0.00" width="14.40" height="2832.00" fill="#007F83" stroke="#007F83"/><text x="60.00" y="69.63" font-family="DejaVu Sans,Arial,sans-serif" font-size="38.33" font-weight="700" fill="#153342">AMADEUS SCHEMA INTEGRATION AT THE STORAGE BOUNDARY</text><text x="60.00" y="139.07" font-family="DejaVu Sans,Arial,sans-serif" font-size="26.67" font-weight="400" fill="#526A78">Current release • ordinary scientific calls • post-calculation enforcement</text><rect x="66.00" y="240.00" width="450.00" height="124.80" fill="#F1F5F7" stroke="#D5E0E5"/><text x="86.40" y="281.03" font-family="DejaVu Sans,Arial,sans-serif" font-size="28.33" font-weight="700" fill="#007F83">01 Build contracts and</text><text x="86.40" y="315.03" font-family="DejaVu Sans,Arial,sans-serif" font-size="28.33" font-weight="700" fill="#007F83">catalog</text><rect x="552.00" y="240.00" width="1296.00" height="124.80" fill="#F1F5F7" stroke="#D5E0E5"/><text x="573.60" y="279.10" font-family="DejaVu Sans,Arial,sans-serif" font-size="25.00" font-weight="400" fill="#24414E">Build once per changed release: LinkML modules, Amadeus mapping and frozen code/unit</text><text x="573.60" y="309.10" font-family="DejaVu Sans,Arial,sans-serif" font-size="25.00" font-weight="400" fill="#24414E">policy/evidence. QA produces pinned JSON/SQL/catalog/registry. dev/check_approval.R;</text><text x="573.60" y="339.10" font-family="DejaVu Sans,Arial,sans-serif" font-size="25.00" font-weight="400" fill="#24414E">validate_release.R. Scientific approval pending.</text><text x="573.60" y="388.40" font-family="DejaVu Sans,Arial,sans-serif" font-size="20.00" font-weight="400" fill="#153342">HUMAN: Approve source authority, units, temporal meaning and scope</text><line x1="290.40" y1="364.80" x2="290.40" y2="420.00" stroke="#007F83" stroke-width="2"/><polygon points="290.40,420.00 285.13,410.35 295.67,410.35" fill="#007F83"/><rect x="66.00" y="420.00" width="450.00" height="124.80" fill="#F1F5F7" stroke="#D5E0E5"/><text x="86.40" y="461.03" font-family="DejaVu Sans,Arial,sans-serif" font-size="28.33" font-weight="700" fill="#007F83">02 User request</text><rect x="552.00" y="420.00" width="1296.00" height="124.80" fill="#F1F5F7" stroke="#D5E0E5"/><text x="573.60" y="459.10" font-family="DejaVu Sans,Arial,sans-serif" font-size="25.00" font-weight="400" fill="#24414E">Input: variables, dates, sites and paths. Ordinary Amadeus arguments; no runtime</text><text x="573.60" y="489.10" font-family="DejaVu Sans,Arial,sans-serif" font-size="25.00" font-weight="400" fill="#24414E">spreadsheet/metadata merge. Integration profile is 16 native daily codes, one-year point</text><text x="573.60" y="519.10" font-family="DejaVu Sans,Arial,sans-serif" font-size="25.00" font-weight="400" fill="#24414E">extraction.</text><text x="573.60" y="568.40" font-family="DejaVu Sans,Arial,sans-serif" font-size="20.00" font-weight="400" fill="#153342">HUMAN: Choose scientific question, sites, dates and supported method</text><line x1="290.40" y1="544.80" x2="290.40" y2="600.00" stroke="#007F83" stroke-width="2"/><polygon points="290.40,600.00 285.13,590.35 295.67,590.35" fill="#007F83"/><rect x="66.00" y="600.00" width="450.00" height="124.80" fill="#F1F5F7" stroke="#D5E0E5"/><text x="86.40" y="641.03" font-family="DejaVu Sans,Arial,sans-serif" font-size="28.33" font-weight="700" fill="#007F83">03 Amadeus download</text><rect x="552.00" y="600.00" width="1296.00" height="124.80" fill="#F1F5F7" stroke="#D5E0E5"/><text x="573.60" y="639.10" font-family="DejaVu Sans,Arial,sans-serif" font-size="25.00" font-weight="400" fill="#24414E">download_data(dataset_name=&quot;gridmet&quot;, ...). Output: source assets or reused cache. Recorder</text><text x="573.60" y="669.10" font-family="DejaVu Sans,Arial,sans-serif" font-size="25.00" font-weight="400" fill="#24414E">observes source identity; a route call does not prove fresh acquisition.</text><text x="573.60" y="748.40" font-family="DejaVu Sans,Arial,sans-serif" font-size="20.00" font-weight="400" fill="#153342">HUMAN: Confirm source/version/cache policy and acquisition claims</text><line x1="290.40" y1="724.80" x2="290.40" y2="780.00" stroke="#007F83" stroke-width="2"/><polygon points="290.40,780.00 285.13,770.35 295.67,770.35" fill="#007F83"/><rect x="66.00" y="780.00" width="450.00" height="124.80" fill="#F1F5F7" stroke="#D5E0E5"/><text x="86.40" y="821.03" font-family="DejaVu Sans,Arial,sans-serif" font-size="28.33" font-weight="700" fill="#007F83">04 Amadeus process</text><rect x="552.00" y="780.00" width="1296.00" height="124.80" fill="#F1F5F7" stroke="#D5E0E5"/><text x="573.60" y="819.10" font-family="DejaVu Sans,Arial,sans-serif" font-size="25.00" font-weight="400" fill="#24414E">process_covariates(covariate=&quot;gridmet&quot;, ...). Output: processed rasters and common TIFF handoff.</text><text x="573.60" y="849.10" font-family="DejaVu Sans,Arial,sans-serif" font-size="25.00" font-weight="400" fill="#24414E">Caller supplies extent/dates; no new scientific dispatcher.</text><text x="573.60" y="928.40" font-family="DejaVu Sans,Arial,sans-serif" font-size="20.00" font-weight="400" fill="#153342">HUMAN: Approve scientific processing; review portability changes</text><line x1="290.40" y1="904.80" x2="290.40" y2="960.00" stroke="#007F83" stroke-width="2"/><polygon points="290.40,960.00 285.13,950.35 295.67,950.35" fill="#007F83"/><rect x="66.00" y="960.00" width="450.00" height="124.80" fill="#F1F5F7" stroke="#D5E0E5"/><text x="86.40" y="1001.03" font-family="DejaVu Sans,Arial,sans-serif" font-size="28.33" font-weight="700" fill="#007F83">05 Amadeus calculate</text><rect x="552.00" y="960.00" width="1296.00" height="124.80" fill="#F1F5F7" stroke="#D5E0E5"/><text x="573.60" y="999.10" font-family="DejaVu Sans,Arial,sans-serif" font-size="25.00" font-weight="400" fill="#24414E">calculate_covariates(covariate=&quot;gridmet&quot;, ...). Output: ordinary R result frames. Native daily,</text><text x="573.60" y="1029.10" font-family="DejaVu Sans,Arial,sans-serif" font-size="25.00" font-weight="400" fill="#24414E">radius 0 / mean, no temporal aggregation in this tested profile.</text><text x="573.60" y="1108.40" font-family="DejaVu Sans,Arial,sans-serif" font-size="20.00" font-weight="400" fill="#153342">HUMAN: Choose/approve extraction method and tolerances</text><line x1="290.40" y1="1084.80" x2="290.40" y2="1140.00" stroke="#007F83" stroke-width="2"/><polygon points="290.40,1140.00 285.13,1130.35 295.67,1130.35" fill="#007F83"/><rect x="66.00" y="1140.00" width="450.00" height="124.80" fill="#E7F4EF" stroke="#D5E0E5"/><text x="86.40" y="1181.03" font-family="DejaVu Sans,Arial,sans-serif" font-size="28.33" font-weight="700" fill="#007F83">06 Verify recorded</text><text x="86.40" y="1215.03" font-family="DejaVu Sans,Arial,sans-serif" font-size="28.33" font-weight="700" fill="#007F83">context</text><rect x="552.00" y="1140.00" width="1296.00" height="124.80" fill="#E7F4EF" stroke="#D5E0E5"/><text x="573.60" y="1179.10" font-family="DejaVu Sans,Arial,sans-serif" font-size="25.00" font-weight="400" fill="#24414E">export_gridmet() after calculation verifies request, function/output and recording consistency.</text><text x="573.60" y="1209.10" font-family="DejaVu Sans,Arial,sans-serif" font-size="25.00" font-weight="400" fill="#24414E">Input: calculated/processed outputs and explicit execution context. Local unsigned evidence.</text><text x="573.60" y="1288.40" font-family="DejaVu Sans,Arial,sans-serif" font-size="20.00" font-weight="400" fill="#153342">HUMAN: Review provenance truth, evidence limits and capture completeness</text><line x1="290.40" y1="1264.80" x2="290.40" y2="1320.00" stroke="#007F83" stroke-width="2"/><polygon points="290.40,1320.00 285.13,1310.35 295.67,1310.35" fill="#007F83"/><rect x="66.00" y="1320.00" width="450.00" height="124.80" fill="#E7F4EF" stroke="#D5E0E5"/><text x="86.40" y="1361.03" font-family="DejaVu Sans,Arial,sans-serif" font-size="28.33" font-weight="700" fill="#007F83">07 Enforce actual-data</text><text x="86.40" y="1395.03" font-family="DejaVu Sans,Arial,sans-serif" font-size="28.33" font-weight="700" fill="#007F83">contract</text><rect x="552.00" y="1320.00" width="1296.00" height="124.80" fill="#E7F4EF" stroke="#D5E0E5"/><text x="573.60" y="1359.10" font-family="DejaVu Sans,Arial,sans-serif" font-size="25.00" font-weight="400" fill="#24414E">schema_export()/storage_validate(): source units, expected membership/time labels, finite values,</text><text x="573.60" y="1389.10" font-family="DejaVu Sans,Arial,sans-serif" font-size="25.00" font-weight="400" fill="#24414E">JSON schema, geometry/references/lineage rules. Output: accepted instance or rejection.</text><text x="573.60" y="1468.40" font-family="DejaVu Sans,Arial,sans-serif" font-size="20.00" font-weight="400" fill="#153342">HUMAN: Approve unit authority, time semantics, binding and missingness</text><line x1="290.40" y1="1444.80" x2="290.40" y2="1500.00" stroke="#007F83" stroke-width="2"/><polygon points="290.40,1500.00 285.13,1490.35 295.67,1490.35" fill="#007F83"/><rect x="66.00" y="1500.00" width="450.00" height="124.80" fill="#E7F4EF" stroke="#D5E0E5"/><text x="86.40" y="1541.03" font-family="DejaVu Sans,Arial,sans-serif" font-size="28.33" font-weight="700" fill="#007F83">08 Typed Parquet and</text><text x="86.40" y="1575.03" font-family="DejaVu Sans,Arial,sans-serif" font-size="28.33" font-weight="700" fill="#007F83">readback</text><rect x="552.00" y="1500.00" width="1296.00" height="124.80" fill="#E7F4EF" stroke="#D5E0E5"/><text x="573.60" y="1539.10" font-family="DejaVu Sans,Arial,sans-serif" font-size="25.00" font-weight="400" fill="#24414E">Storage boundary writes/reads typed staging records; shared semantic checks remain. Adapter</text><text x="573.60" y="1569.10" font-family="DejaVu Sans,Arial,sans-serif" font-size="25.00" font-weight="400" fill="#24414E">also materializes Parquet. No footer-only enforcement or zero-copy claim.</text><text x="573.60" y="1648.40" font-family="DejaVu Sans,Arial,sans-serif" font-size="20.00" font-weight="400" fill="#153342">HUMAN: Approve logical types, null semantics and required readback fidelity</text><line x1="290.40" y1="1624.80" x2="290.40" y2="1680.00" stroke="#007F83" stroke-width="2"/><polygon points="290.40,1680.00 285.13,1670.35 295.67,1670.35" fill="#007F83"/><rect x="66.00" y="1680.00" width="450.00" height="124.80" fill="#E7F4EF" stroke="#D5E0E5"/><text x="86.40" y="1721.03" font-family="DejaVu Sans,Arial,sans-serif" font-size="28.33" font-weight="700" fill="#007F83">09 Load and verify</text><text x="86.40" y="1755.03" font-family="DejaVu Sans,Arial,sans-serif" font-size="28.33" font-weight="700" fill="#007F83">DuckDB</text><rect x="552.00" y="1680.00" width="1296.00" height="124.80" fill="#E7F4EF" stroke="#D5E0E5"/><text x="573.60" y="1719.10" font-family="DejaVu Sans,Arial,sans-serif" font-size="25.00" font-weight="400" fill="#24414E">database.R/parquet_experiment.R map/load accepted rows, run 102 SQL queries, check tolerances</text><text x="573.60" y="1749.10" font-family="DejaVu Sans,Arial,sans-serif" font-size="25.00" font-weight="400" fill="#24414E">and reopen. Empty-table checks do not establish full-model coverage.</text><text x="573.60" y="1828.40" font-family="DejaVu Sans,Arial,sans-serif" font-size="20.00" font-weight="400" fill="#153342">HUMAN: Approve key/reference rules, tolerance and coverage interpretation</text><line x1="290.40" y1="1804.80" x2="290.40" y2="1860.00" stroke="#007F83" stroke-width="2"/><polygon points="290.40,1860.00 285.13,1850.35 295.67,1850.35" fill="#007F83"/><rect x="66.00" y="1860.00" width="450.00" height="124.80" fill="#E7F4EF" stroke="#D5E0E5"/><text x="86.40" y="1901.03" font-family="DejaVu Sans,Arial,sans-serif" font-size="28.33" font-weight="700" fill="#007F83">10 Bind the published</text><text x="86.40" y="1935.03" font-family="DejaVu Sans,Arial,sans-serif" font-size="28.33" font-weight="700" fill="#007F83">snapshot</text><rect x="552.00" y="1860.00" width="1296.00" height="124.80" fill="#E7F4EF" stroke="#D5E0E5"/><text x="573.60" y="1899.10" font-family="DejaVu Sans,Arial,sans-serif" font-size="25.00" font-weight="400" fill="#24414E">storage_publish_manifest(): hashes schema/acceptance/results/source metadata, recording,</text><text x="573.60" y="1929.10" font-family="DejaVu Sans,Arial,sans-serif" font-size="25.00" font-weight="400" fill="#24414E">DB/receipt and accepted Parquet. Relative whitelisted paths; release and instance bindings.</text><text x="573.60" y="2008.40" font-family="DejaVu Sans,Arial,sans-serif" font-size="20.00" font-weight="400" fill="#153342">HUMAN: Approve trust model and required protected artifacts</text><line x1="290.40" y1="1984.80" x2="290.40" y2="2040.00" stroke="#007F83" stroke-width="2"/><polygon points="290.40,2040.00 285.13,2030.35 295.67,2030.35" fill="#007F83"/><rect x="66.00" y="2040.00" width="450.00" height="124.80" fill="#E7F4EF" stroke="#D5E0E5"/><text x="86.40" y="2081.03" font-family="DejaVu Sans,Arial,sans-serif" font-size="28.33" font-weight="700" fill="#007F83">11 Complete and publish</text><text x="86.40" y="2115.03" font-family="DejaVu Sans,Arial,sans-serif" font-size="28.33" font-weight="700" fill="#007F83">pointer</text><rect x="552.00" y="2040.00" width="1296.00" height="124.80" fill="#E7F4EF" stroke="#D5E0E5"/><text x="573.60" y="2079.10" font-family="DejaVu Sans,Arial,sans-serif" font-size="25.00" font-weight="400" fill="#24414E">Critical files marked readonly; workflow receipt binds manifest SHA; final LATEST replacement.</text><text x="573.60" y="2109.10" font-family="DejaVu Sans,Arial,sans-serif" font-size="25.00" font-weight="400" fill="#24414E">Failed load retains diagnostics but does not complete/advance pointer. Not multi-file crash</text><text x="573.60" y="2139.10" font-family="DejaVu Sans,Arial,sans-serif" font-size="25.00" font-weight="400" fill="#24414E">durability.</text><text x="573.60" y="2188.40" font-family="DejaVu Sans,Arial,sans-serif" font-size="20.00" font-weight="400" fill="#153342">HUMAN: Approve filesystem/recovery and retention requirements</text><line x1="290.40" y1="2164.80" x2="290.40" y2="2220.00" stroke="#007F83" stroke-width="2"/><polygon points="290.40,2220.00 285.13,2210.35 295.67,2210.35" fill="#007F83"/><rect x="66.00" y="2220.00" width="450.00" height="124.80" fill="#E7F4EF" stroke="#D5E0E5"/><text x="86.40" y="2261.03" font-family="DejaVu Sans,Arial,sans-serif" font-size="28.33" font-weight="700" fill="#007F83">12 Verify open and query</text><rect x="552.00" y="2220.00" width="1296.00" height="124.80" fill="#E7F4EF" stroke="#D5E0E5"/><text x="573.60" y="2259.10" font-family="DejaVu Sans,Arial,sans-serif" font-size="25.00" font-weight="400" fill="#24414E">database.R RUN duckdb SQL invokes storage_verify_publication() once per open, then read-only</text><text x="573.60" y="2289.10" font-family="DejaVu Sans,Arial,sans-serif" font-size="25.00" font-weight="400" fill="#24414E">query. Checks completion/release/file bytes; no source NetCDF reread. Direct IDE/DBI bypasses</text><text x="573.60" y="2319.10" font-family="DejaVu Sans,Arial,sans-serif" font-size="25.00" font-weight="400" fill="#24414E">guards.</text><text x="573.60" y="2368.40" font-family="DejaVu Sans,Arial,sans-serif" font-size="20.00" font-weight="400" fill="#153342">HUMAN: Choose supported access path and deployment controls</text><line x1="290.40" y1="2344.80" x2="290.40" y2="2400.00" stroke="#007F83" stroke-width="2" stroke-dasharray="7 5"/><polygon points="290.40,2400.00 285.13,2390.35 295.67,2390.35" fill="#007F83"/><rect x="66.00" y="2400.00" width="450.00" height="124.80" fill="#FFF2DD" stroke="#D5E0E5"/><text x="86.40" y="2441.03" font-family="DejaVu Sans,Arial,sans-serif" font-size="28.33" font-weight="700" fill="#007F83">13 Separate</text><text x="86.40" y="2475.03" font-family="DejaVu Sans,Arial,sans-serif" font-size="28.33" font-weight="700" fill="#007F83">scientific/replay review</text><rect x="552.00" y="2400.00" width="1296.00" height="124.80" fill="#FFF2DD" stroke="#D5E0E5"/><text x="573.60" y="2439.10" font-family="DejaVu Sans,Arial,sans-serif" font-size="25.00" font-weight="400" fill="#24414E">QA direct NetCDF comparison passed 336 values locally. Human unit/physical-time/scope sign-off</text><text x="573.60" y="2469.10" font-family="DejaVu Sans,Arial,sans-serif" font-size="25.00" font-weight="400" fill="#24414E">and independent colleague/environment replay remain pending. Not production approval.</text><text x="573.60" y="2548.40" font-family="DejaVu Sans,Arial,sans-serif" font-size="20.00" font-weight="400" fill="#153342">HUMAN: Approve units, physical time, binding, provenance, acceptance; independently replay; decide release</text><rect x="66.00" y="2604.00" width="1782.00" height="75.60" fill="#E7F4EF" stroke="#E7F4EF"/><text x="86.40" y="2641.90" font-family="DejaVu Sans,Arial,sans-serif" font-size="25.00" font-weight="700" fill="#153342">During stages 3–5, the recorder observes calls, source hashes and outputs; it does not run science or enforce the schema.</text><text x="66.00" y="189.93" font-family="DejaVu Sans,Arial,sans-serif" font-size="23.33" font-weight="700" fill="#007F83">AI: development/review assistance only. Runtime: deterministic code. Human scientific approvals: pending.</text><text x="66.00" y="2727.93" font-family="DejaVu Sans,Arial,sans-serif" font-size="23.33" font-weight="400" fill="#153342">Trace authority → implementation → tests → human decision in the supplied registers. No new runtime AI or approval service.</text></svg>