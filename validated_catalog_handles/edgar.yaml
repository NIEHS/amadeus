schema_version: 0.1.0
data_sources:
- id: amadeus:source/ec_jrc_edgar
  name: ec_jrc_edgar
  label: EDGAR v8.1 air-pollutant inventory
  producer_institution: European Commission, Joint Research Centre
  homepage: https://edgar.jrc.ec.europa.eu/dataset_ap81
  access_protocol: https_bulk_file
  requires_authentication: false
  amadeus_function_suffix: _edgar
  description: Pinned EDGAR v8.1 FT2022 AP inventory, nine adapter-listed air pollutants. Excludes large-scale
    biomass burning and LULUCF. Primary PM emissions are not ambient concentrations or secondary particulate
    formation. SO2 shipping was revised in November 2024; retrieve current corrected files and retain
    per-file checksums. No methods-paper DOI is asserted as a dataset DOI. Workbook I14 says CC BY 4.0,
    but the inspected release headers refer to conditions URLs without naming a verified SPDX license.
    The inventory assertion is preserved in the audit; license_spdx is left unset pending release-specific
    confirmation.
  citation_apa: European Commission, Joint Research Centre. EDGAR v8.1 global air pollutant emissions,
    1970–2022. https://edgar.jrc.ec.europa.eu/dataset_ap81. Follow the provider how-to-cite and attribution
    conditions.
products:
- id: amadeus:product/edgar_v81_bc_annual_totals_emi
  name: edgar_v81_bc_annual_totals_emi
  label: EDGAR v8.1 BC annual TOTALS emi
  data_source: amadeus:source/ec_jrc_edgar
  data_genre:
  - emissions
  - air_pollution
  native_format: netcdf4_cf
  spatial_support_type: raster_grid_cell
  temporal_resolution: annual
  description: 'All-sector annual totals delivery, 1970–2022. The 2022 original file for this exact species/output
    was inspected. Emissions are tonnes per cell for the named year; fluxes are kg/m2/s. These are distinct
    products and cannot use the same polygon reduction. calculate_edgar currently hardcodes a mean: that
    is not a polygon total for cell mass. A total needs clipped cell-mass allocation; a flux integral
    needs cell areas and verified time support, not an assumed 365-day multiplier. No monthly/sector-specific
    scale is copied from this profile. Global coordinate centres are verified, but the file has no explicit
    datum authority: GDAL CRS84 is an interpretation, not provider datum evidence. AMADEUS:100007 is an
    unresolved required-slot placeholder; no geometry execution is certified.'
  product_version: EDGARv8.1 FT2022 AP
  grid_definition: amadeus:grid/edgar_v81_global_01deg
  crs: AMADEUS:100007
  temporal_resolution_iso: P1Y
  temporal_coverage_start: '1970-01-01'
  temporal_coverage_end: '2022-12-31'
  native_spatial_resolution_descriptor: 0.1 degree cells; 3600 × 1800
  spatial_extent_descriptor: Global inventory grid; excluded sources and missing values remain qualified
  access_url: https://jeodpp.jrc.ec.europa.eu/ftp/jrc-opendata/EDGAR/datasets/v81_FT2022_AP_new/BC/TOTALS/emi_nc/
  amadeus_process_covariate: edgar
