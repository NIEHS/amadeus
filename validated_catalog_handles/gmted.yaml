schema_version: 0.1.0
data_sources:
- id: amadeus:source/usgs_nga_gmted2010
  name: usgs_nga_gmted2010
  label: GMTED2010
  producer_institution: U.S. Geological Survey; National Geospatial-Intelligence Agency
  homepage: https://www.usgs.gov/coastal-changes-and-impacts/gmted2010
  access_protocol: https_bulk_file
  requires_authentication: false
  amadeus_function_suffix: _gmted
  description: Static multi-source terrain compilation, published 2011. Horizontal WGS84; predominant vertical EGM96
    with provider-documented source exceptions. Compilation label 2010 is not observation year. Source acquisition
    dates, coverage and accuracy vary; nominal angular spacing is not constant ground metres. USGS public-domain
    data; cite Danielson and Gesch (2011), USGS Open-File Report 2011-1073.
  citation_apa: Danielson, J.J., and Gesch, D.B. (2011). Global Multi-resolution Terrain Elevation Data 2010 (GMTED2010).
    USGS Open-File Report 2011-1073. https://doi.org/10.3133/ofr20111073
products:
- id: amadeus:product/gmted2010_be15_arcgrid
  name: gmted2010_be15_arcgrid
  label: GMTED2010 Breakline Emphasis 15 arcsec
  data_source: amadeus:source/usgs_nga_gmted2010
  spatial_support_type: raster_grid_cell
  temporal_resolution: timeless
  description: 'Original provider Arc/Info binary grid (AIG), not ASCII Grid. Native archive metadata for this exact
    variant verifies dimensions, geotransform, WGS84 and Int16 nodata -32768. AIG has no existing accurate format
    enum; native_format is intentionally unset. No scale or offset supplied: valid signed elevations are metres,
    negative elevations and zero are valid. GMTED standard deviation measures sub-cell elevation variation, not
    DEM accuracy or absolute elevation. Native GeoTIFF sample metadata independently corroborates every statistic/resolution;
    TIFF tile extent is not the full ArcGrid extent. Angular grids retain a half-arcsecond offset; do not snap to
    -180/90. Thirty-arcsecond mean/subsample grids have 20880 rows, others 16800; finer archives have 33600/67200
    rows. Not all statistic/resolution combinations share polar coverage. Floating writer differences below 0.001
    cell across the domain share one GridDefinition; each exact native geotransform is retained in arcgrid_native.json.
    No synthetic time interval is assigned.'
  data_genre:
  - elevation
  product_version: GMTED2010
  grid_definition: amadeus:grid/gmted2010_arcgrid_15_33600
  crs: EPSG:4326
  srid: 4326
  doi: 10.3133/ofr20111073
  spatial_extent_descriptor: Native archive extent; land coverage and polar fill vary by statistic/resolution
  native_spatial_resolution_descriptor: 15 arcseconds; exact archive geotransform retained
  access_url: https://edcintl.cr.usgs.gov/downloads/sciweb1/shared/topo/downloads/GMTED/Grid_ZipFiles/be15_grd.zip
  amadeus_dataset_name: gmted
  amadeus_process_covariate: gmted
  amadeus_calculate_covariate: gmted
