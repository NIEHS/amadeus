  description: 'Historical global road-network compilation (2013 release), representations from the 1980s–2010
    vary by country and many dates are unknown. NASA CMR UseConstraints explicitly preserves country-specific
    additional credits/restrictions; no blanket SPDX CC-BY-4.0 is asserted. [Resource reconciliation:
    inventory rights and history] Inventory usage/citation statement (Amadeus data sources!I11): CC BY
    4.0; cite CIESIN & ITOS (2013); Earthdata login required. Inventory source status (H11): Static; this
    is not observation QA, API availability or verified support for every product. Inventory first-release/history
    wording (J11): 2013. Current CMR UseConstraints requires country-specific credits/restrictions. The
    inventory blanket CC BY statement is not adopted. Historical network dates are heterogeneous, not
    a uniform observation interval.'
  auth_mechanism: NASA Earthdata Login / bearer token for protected data downloads; public metadata needs
    no token
  citation_apa: Center for International Earth Science Information Network - CIESIN - Columbia University,
    and Information Technology Outreach Services - ITOS - University of Georgia (2013). Global Roads Open
