  - roadways
  - built_environment
  native_format: geodatabase
  spatial_support_type: line_feature
  temporal_resolution: timeless
  description: 'Native road polylines. Global Shapefile request is redirected to geodatabase by the adapter;
    regional Shapefile is a separate delivery profile. Geometry is represented as line support, not a
    fabricated numeric road-density band. LENGTH_KM/ROADID/SOURCEID are present in the repository fixture,
    but original guide access requires authentication; their provider-wide availability remains qualified.
    Runtime road length/density must be recomputed after geometric intersection with an appropriate metric
    CRS and each target area; original LENGTH_KM must not be summed for partially intersected segments.
    Missing roads do not prove no roads. Stored 1980–2010 family history is not a common valid-time interval
    for all features. [Resource reconciliation: inventory completeness] Inventory coverage statement (Amadeus
    data sources!N11): Yes (global; completeness varies by country). This statement does not establish
    validity of every cell/date or fill observation gaps.'
  product_version: '1.0'
