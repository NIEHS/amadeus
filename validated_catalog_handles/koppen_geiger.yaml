  data_genre:
  - climate
  - climate_classification
  native_format: geotiff
  spatial_support_type: raster_grid_cell
  temporal_resolution: timeless
  description: 'Static classification and companion agreement maps summarizing 1980–2016. timeless follows
    the existing schema convention for static Köppen maps: no temporal_coverage dates are asserted. The
    climatological reference periods remain explicit here; this is not an annual observation series. 1980–2016
    spans 37 years, despite the workbook generic 30-year wording. The 2018 V1 future map is RCP8.5, not
    the 2023 V2 ensemble. Nominal 0.0083/0.083 labels are rounded; exact spacings and dimensions come
    from all twelve TIFF headers. [Resource reconciliation: inventory completeness] Inventory coverage
    statement (Amadeus data sources!N5): Yes (global land). This statement does not establish validity
    of every cell/date or fill observation gaps.'
  product_version: Beck_KG_V1 (2018)
  grid_definition: amadeus:grid/koppen_v1_0p0083
