  name: koppen_geiger_beck
  label: Beck et al. Köppen–Geiger maps
  producer_institution: Beck et al. author team; Figshare data repository
  homepage: https://doi.org/10.6084/m9.figshare.6396959
  access_protocol: https_bulk_file
  requires_authentication: false
  amadeus_function_suffix: _koppen_geiger
  description: 'Pinned Beck_KG_V1.zip, Figshare file 12407516, matching the current R adapter. The workbook
    also cites the scientifically distinct 2023 V2 release; that reference must not replace the V1 methods
    or future scenario. [Resource reconciliation: inventory rights and history] Inventory usage/citation
    statement (Amadeus data sources!I5): CC BY 4.0; cite Beck et al. (2018). Inventory source status (H5):
    Available (V1; superseded by V2, 2023); this is not observation QA, API availability or verified support
    for every product. Inventory first-release/history wording (J5): 2018. The adapter pins the Beck V1
    archive. The separate 2023 reference describes V2 and does not change the V1 scenario, period or version.
    Static availability is not an annual update cadence.'
  license_spdx: CC-BY-4.0
  citation_apa: Beck, H. E., et al. (2018). Present and future Köppen–Geiger climate classification maps
    at 1-km resolution. Scientific Data, 5, 180214. https://doi.org/10.1038/sdata.2018.214
