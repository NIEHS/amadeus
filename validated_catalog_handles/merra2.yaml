schema_version: 0.1.0
data_sources:
- id: amadeus:source/nasa_gmao_merra2
  name: nasa_gmao_merra2
  label: NASA MERRA-2
  producer_institution: NASA GMAO; NASA GES DISC
  homepage: https://gmao.gsfc.nasa.gov/gmao-products/merra-2/
  access_protocol: https_bulk_file
  requires_authentication: true
  amadeus_function_suffix: _merra2
  description: 'MERRA-2 reanalysis V5.12.4. Seven collection profiles and all 45 science fields in their
    NASA specification tables are registered. Other adapter collections, monthly products and FWI are
    outside this verified scope. FWI is not silently treated as one of these NASA reanalysis collections.
    [Resource reconciliation: inventory rights and history] Inventory usage/citation statement (Amadeus
    data sources!I9): No restrictions (NASA GES DISC); cite Gelaro et al. (2017); Earthdata login required.
    Inventory source status (H9): Active; this is not observation QA, API availability or verified support
    for every product. Inventory first-release/history wording (J9): 2015. 2015 is release history, not
    the 1980 reanalysis start. Current NASA CMR/specification correct the daily-statistics DOI and the
    workbook three-hourly label on the hourly chemistry collection. Monthly duplicate row 80 is excluded
    as a distinct product.'
  auth_mechanism: NASA Earthdata Login / bearer token for protected data downloads; public metadata needs
    no token
  citation_apa: Gelaro et al. (2017). The Modern-Era Retrospective Analysis for Research and Applications,
    Version 2 (MERRA-2). https://doi.org/10.1175/JCLI-D-16-0758.1. Collection-specific data citations
    are retained on Product.
