# Discovery projection of the corresponding dataset spec; identical stable IDs/metadata.
schema_version: 0.1.0
data_sources:
- id: amadeus:source/nasa_modis
  name: nasa_modis
  label: NASA MODIS (Terra/Aqua)
  producer_institution: NASA EOSDIS; LP DAAC and LAADS DAAC
  homepage: https://modis.gsfc.nasa.gov/data/
  access_protocol: https_bulk_file
  requires_authentication: true
  amadeus_function_suffix: _modis
  description: 'Product-specific MODIS Collection 6.1 profiles. MOD prefix denotes Terra; MCD combines
    Terra and Aqua. Public metadata is open; protected data downloads require Earthdata credentials. NASA
    unrestricted use statement is not converted to an unsupported SPDX identifier. Cite each product DOI.
    VIIRS products accepted by the same R adapter are outside this MODIS source. MOD13A2 is registered
    using the multi_day enum extension and a verified inverse decoder; the legacy R processors retain
    raw values by design. [Resource reconciliation: inventory rights and history] Inventory usage/citation
    statement (Amadeus data sources!I8): No restrictions (NASA EOSDIS); cite product DOI; Earthdata login
    required. Inventory source status (H8): Active (Terra/Aqua extended mission); this is not observation
    QA, API availability or verified support for every product. Inventory first-release/history wording
    (J8): 2000. 2000 is family history, not the start date of every MODIS product/version. Product dates
    come from NASA CMR where available. DOI-specific citations are supplied on the actual product records,
    not as a single family citation.'
  auth_mechanism: NASA Earthdata Login / bearer token for protected data downloads; public metadata needs
    no token
