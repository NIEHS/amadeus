  - satellite
  native_format: hdf4
  spatial_support_type: raster_grid_cell
  temporal_resolution: daily
  description: 'Native HDF-EOS Collection 6.1. Separate resolution groups reuse one DOI; they are profiles
    of the same delivery, not new NASA products. Daily files retain observation times/orbits and are not
    automatically daily means or complete cloud-free coverage. Tile origins depend on h/v; global array
    dimensions are not copied from a sample tile. Header coordinate rounding differs by less than 0.0001
    m across inspected collections. AMADEUS:100002 is an explicitly registered project-local CRS label
    for the exact sphere/projection, not an EPSG code or database SRID. Only the stated bands are registered;
    full native inventories remain in evidence. MOD11/MOD09 sample archive ranges are UTC-midnight to
    23:59:59; this archive-day convention does not convert MOD11 local-solar viewing hours into UTC. MAIAC
    preserves per-orbit acquisition intervals with observation-dependent support. The existing processor
    defaults select science bands only; explicit custom_sel is required for the registered QA/ancillary
    bands and resolution groups. NASA CMR collection identifier C1748058432-LPCLOUD; this is not a STAC
    identifier. [Resource reconciliation: inventory completeness] Inventory coverage statement (Amadeus
    data sources!N8): Yes (global; cloud/swath gaps). This statement does not establish validity of every
    cell/date or fill observation gaps.'
  product_version: '061'
  doi: 10.5067/MODIS/MOD11A1.061
  temporal_resolution_iso: P1D
  temporal_alignment: interval
  calendar: gregorian
  access_url: https://doi.org/10.5067/MODIS/MOD11A1.061
  amadeus_dataset_name: modis
  amadeus_process_covariate: modis_merge
  grid_definition: amadeus:grid/modis_sinusoidal_1km
  crs: AMADEUS:100002
