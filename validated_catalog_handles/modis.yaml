  description: 'Native HDF-EOS Collection 6.1. Separate resolution groups reuse one DOI; they are profiles
    of the same delivery, not new NASA products. Daily files retain observation times/orbits and are not
    automatically daily means or complete cloud-free coverage. Tile origins depend on h/v; global array
    dimensions are not copied from a sample tile. Header coordinate rounding differs by less than 0.0001
    m across inspected collections. AMADEUS:100002 is an explicitly registered project-local CRS label
    for the exact sphere/projection, not an EPSG code or database SRID. Only the stated bands are registered;
    full native inventories remain in evidence. MOD06 is an irregular geolocated swath; existing support=other
    is deliberate. No affine GridDefinition or fixed CRS/SRID is asserted. Use per-pixel geolocation.
    Five-minute granule duration is not a daily averaging window. Scope: five 5-km cloud-top/fraction/phase
    bands, not every swath retrieval. [Resource reconciliation: inventory completeness] Inventory coverage
    statement (Amadeus data sources!N8): Yes (global; cloud/swath gaps). This statement does not establish
    validity of every cell/date or fill observation gaps.'
