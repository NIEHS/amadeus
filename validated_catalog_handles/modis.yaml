- id: amadeus:product/mod13a2_061_1km
  name: mod13a2_061_1km
  label: MOD13A2.061 vegetation indices 16-day 1km
  data_source: amadeus:source/nasa_modis
  data_genre:
  - land_use
  - satellite
  native_format: hdf4
  spatial_support_type: raster_grid_cell
  temporal_resolution: multi_day
  description: 'Collection 6.1 nominal 16-day composite, not a mean of 16 daily index values. NASA MOD13
    guide section 6/Table 8 supplies decoder multipliers. Native HDF scale_factor is its reciprocal for
    VI/reflectance/angles; preserve the attribute and divide. Read actual RANGEBEGINNING/ENDINGDATE/TIME
    from every granule, including year-end cycles; never synthesize all bounds from P16D. Composite day
    of year is a selected-pixel acquisition-day label, not Julian calendar time. Default R selection loads
    NDVI only and returns raw values; explicitly select other bands and decode once before physical calculations.
    QA policies require an explicit analysis choice; category/QA values are never averaged. [Resource
    reconciliation: inventory completeness] Inventory coverage statement (Amadeus data sources!N8): Yes
    (global; cloud/swath gaps). This statement does not establish validity of every cell/date or fill
    observation gaps.'
