  spatial_extent_descriptor: Conterminous United States; map years 1985–2024, C1V1.
  native_spatial_resolution_m: 30.0
  native_spatial_resolution_descriptor: Native 30 m equal-area pixels on WGS84 Albers; not EPSG:5070.
  temporal_resolution: annual
  calendar: gregorian
  doi: 10.5066/P94UXNTS
  access_url: https://www.mrlc.gov/downloads/sciweb1/shared/mrlc/data-bundles/
  amadeus_dataset_name: nlcd
  amadeus_process_covariate: nlcd
  description: 'Pinned Annual NLCD C1V1; select download_nlcd(product="Land Cover", year=YYYY). Archive
    Annual_NLCD_LndCov_YYYY_CU_C1V1.zip. Each annual map is a modelled land-surface product, not a year-long
    measurement at every pixel. Nominal land-cover classes; use class proportions or nearest-category
    lookup, never a mean of integer IDs. Local crs AMADEUS:100001 is defined by the linked grid proj_string;
    it is not an EPSG code or database SRID. A newer C1V2 release must not be silently substituted. [Resource
    reconciliation: inventory completeness] Inventory coverage statement (Amadeus data sources!N6): Yes
