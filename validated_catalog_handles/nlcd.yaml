grid_definitions:
- id: amadeus:grid/nlcd_annual_c1_conus_30m
  name: nlcd_annual_c1_conus_30m
  label: Annual NLCD Collection 1 native CONUS 30 m WGS84 Albers grid
  crs: AMADEUS:100001
  proj_string: +proj=aea +lat_0=23 +lon_0=-96 +lat_1=29.5 +lat_2=45.5 +x_0=0 +y_0=0 +datum=WGS84 +units=m
    +no_defs
  grid_mapping_name: albers_conical_equal_area
  resolution_x: 30.0
  resolution_y: 30.0
  resolution_unit: m
  n_rows: 105000
  n_columns: 160000
