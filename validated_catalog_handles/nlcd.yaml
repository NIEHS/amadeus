# Discovery projection of the corresponding dataset spec; identical stable IDs/metadata.
schema_version: 0.1.0
data_sources:
- id: amadeus:source/mrlc_nlcd
  name: mrlc_nlcd
  label: USGS / MRLC Annual NLCD
  producer_institution: U.S. Geological Survey, EROS; MRLC Consortium
  homepage: https://www.mrlc.gov/data
  access_protocol: https_bulk_file
  requires_authentication: false
  amadeus_function_suffix: _nlcd
  doi: 10.5066/P94UXNTS
  citation_apa: U.S. Geological Survey. (2025). Annual National Land Cover Database (NLCD), Collection
    1, Version 1.1. U.S. Geological Survey data release. https://doi.org/10.5066/P94UXNTS
  description: 'Annual NLCD is distinct from Legacy NLCD. This catalog pins C1V1 (map years 1985–2024)
    to match the local downloader and verified release metadata. C1V2 is a separate newer release; the
    shared DOI alone is not a version pin. [Resource reconciliation: inventory rights and history] Inventory
    usage/citation statement (Amadeus data sources!I6): Public domain (U.S. Gov); citation requested.
    Inventory source status (H6): Active (Annual NLCD); this is not observation QA, API availability or
    verified support for every product. Inventory first-release/history wording (J6): 2024. The source
    row describes the Annual series launch in 2024, while the broader inventory and bibliography also
    contain Legacy NLCD. Neither the Legacy dates nor Legacy DOIs identify Annual C1V1.'
