schema_version: 0.1.0
data_sources:
- id: amadeus:source/opengeohub_openlandmap
  name: opengeohub_openlandmap
  label: OpenLandMap STAC soil products
  producer_institution: OpenGeoHub Foundation; EnvirometriX Ltd
  homepage: https://docs.openlandmap.org/
  access_protocol: https_bulk_file
  requires_authentication: false
  amadeus_function_suffix: _olm
  description: Family-level inventory is broader than the six native-verified long-term soil collections registered
    here. All current root collection documents are retained as discovery evidence, not automatically executable
    profiles. Other collections differ in producer, license, grid, variable, period and decoding. R/ignore.R OLM
    helpers are explicitly excluded from package exports and all three dispatch wrappers; no working wrapper route
    is asserted. License and DOI are taken per collection, not the workbook-wide most-layers statement or family
    Zenodo DOI.
products:
- id: amadeus:product/olm_soil_ph_h2o_usda_4c1a2a_v02
  name: olm_soil_ph_h2o_usda_4c1a2a_v02
  label: OpenLandMap long-term soil pH; native 250 m COGs
  data_source: amadeus:source/opengeohub_openlandmap
  spatial_support_type: model_grid_cell
  temporal_resolution: timeless
  description: 'Soil pH in H2O at 6 standard depths (0, 10, 30, 60, 100 and 200 cm) at 250 m resolution according
    to USDA method code: 4C1a2a. 6 available depth-specific first-image TIFF headers verify grid, byte storage,
    nodata 255 and WGS84. Nominal 250 m corresponds to native 0.002083333 degree cells, not globally constant metres.
    Native 1950–2017 labels are the long-term modelling reference, not annual observations or a temporal interpolation
    license. Filenames say v0.2 while collection version says v0; retain both rather than silently equating versions.
    The TIFFs do not contain affine scale/offset metadata; product-specific scientific conversion is recorded separately.
    pH encoded x10 means raw/10; bulk density raw*10 kg/m3; organic carbon raw*5 g/kg (raw/2 percent). Sand is mass
    percent, water is volumetric percent; they are not the same fraction. Texture codes are nominal, never arithmetic
    means. R OLM helper currently only reads rasters and does not implement these conversions. Sand depths 30/200
    cm and water depth 10 cm are absent from the STAC items; probes of the analogous provider objects return 404,
    so they are not invented. The malformed empty-depth texture asset also returns 404 and is excluded. Native item
    GeoJSON has apparent reversed coordinate order; grid geometry is taken from TIFF GeoKeys/tiepoints, not that
    polygon.'
  data_genre: []
  native_format: cloud_optimized_geotiff
  grid_definition: amadeus:grid/olm_longterm_soil_250m_geographic_1
  crs: EPSG:4326
  srid: 4326
  product_version: v0.2 filenames; v0 collection label
  license_spdx: CC-BY-SA-4.0
  doi: 10.5281/zenodo.2525664
  stac_collection_id: ph.h2o_usda.4c1a2a
  access_url: https://s3.eu-central-1.wasabisys.com/stac/openlandmap/ph.h2o_usda.4c1a2a/collection.json
  spatial_extent_descriptor: Native long-term soil grid; excludes Antarctica and nodata cells; STAC geometry not
    trusted
  native_spatial_resolution_descriptor: 250 m nominal; native 0.002083333 degree cells; verified point-depth labels
    [0, 10, 30, 60, 100, 200]
