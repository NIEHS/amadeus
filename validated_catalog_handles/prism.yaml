schema_version: 0.1.0
data_sources:
- id: amadeus:source/osu_prism
  name: osu_prism
  label: PRISM Climate Group
  producer_institution: PRISM Climate Group, Oregon State University
  homepage: https://prism.oregonstate.edu/
  access_protocol: https_bulk_file
  requires_authentication: false
  amadeus_function_suffix: _prism
  description: Station-based physiographically informed climate modelling. Seven adapter time-series fields
    at daily/monthly/annual support and 1991–2020 monthly normals are distinguished. Source quality/version/release
    changes are per file, not a blanket final status. Attribution and provider redistribution/use terms
    are retained; free access does not establish an SPDX license.
  citation_apa: PRISM Climate Group, Oregon State University. https://prism.oregonstate.edu/; identify
    dataset type, variable, resolution, observation period and retrieval date as required by provider
    terms.
products:
- id: amadeus:product/prism_ppt_daily_4km
  name: prism_ppt_daily_4km
  label: PRISM ppt daily 4 km
  data_source: amadeus:source/osu_prism
  data_genre:
  - climate
  - meteorology
  native_format: netcdf4_cf
  spatial_support_type: raster_grid_cell
  temporal_resolution: daily
  description: 'Current service NetCDF delivery verified for this exact element/support (2020 sample).
    Generic Band1 carries no units attribute; authoritative XML/dataset guide and filename supply element
    identity/units. Float32 physical values use nodata -9999; do not apply a legacy hundredths factor.
    NAD83 is explicitly encoded, not EPSG:4326. Daily PRISM day ends at 12:00 UTC; monthly/annual temperatures
    average daily statistics and precipitation totals retain their distinct support. Actual file info.txt
    records per-file dataset version, release number and source processing dates; one sample is not a
    historical-series version assertion. Supply explicit file paths to process_prism: its directory regex
    expects old uppercase names while current provider filenames start lowercase prism_. Variable-specific
    early availability must be checked; family-wide 1895/1981 coverage is not silently applied to every
    field.'
  grid_definition: amadeus:grid/prism_current_conus_25arcmin
  crs: EPSG:4269
  srid: 4269
  temporal_resolution_iso: P1D
  native_spatial_resolution_descriptor: 2.5 arc-minutes, nominal 4 km; geographic cell area varies
  spatial_extent_descriptor: Conterminous United States PRISM grid; masks/quality/release state apply
  access_url: https://services.nacse.org/prism/data/get/us/4km/ppt/
  amadeus_process_covariate: prism
  amadeus_calculate_covariate: prism
  amadeus_dataset_name: prism
  day_boundary_convention: ending_1200_gmt
