- id: amadeus:product/prism_norm91_monthly_4km
  name: prism_norm91_monthly_4km
  label: PRISM 1991–2020 monthly normals 4km
  data_source: amadeus:source/osu_prism
  data_genre:
  - climate
  - meteorology
  native_format: cloud_optimized_geotiff
  spatial_support_type: raster_grid_cell
  temporal_resolution: timeless
  description: Twelve recurring calendar-month climatologies for baseline 1991–2020, not observed 2020
    monthly values. Filename 202001_avg_30y labels January of the period ending 2020. Monthly precipitation
    normal is the mean of monthly totals; temperatures/VPD retain mean daily-statistic semantics. Native
    TIFF headers and companion XML were verified for every registered field using January examples. Solar
    fields are published at 800 m here, not invented at 4 km. Solar energy values are mean daily amounts;
    do not multiply by month length to relabel them as source monthly totals. Legacy adapter normals service
    route returns an error body with HTTP 200; the verified provider directory is used for discovery,
    and no working download_data route is asserted. Full-file process_prism works with explicit file selection.
    Daily/annual normals remain separate, unregistered scopes.
  grid_definition: amadeus:grid/prism_current_conus_25arcmin
  crs: EPSG:4269
  srid: 4269
  spatial_extent_descriptor: CONUS; native NAD83 geographic grid
  native_spatial_resolution_descriptor: 2.5 arc-minutes
  access_url: https://data.prism.oregonstate.edu/normals/us/4km/
  amadeus_process_covariate: prism
  amadeus_calculate_covariate: prism
